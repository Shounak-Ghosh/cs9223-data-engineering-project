[project]
name = "de-semantic-optimizer"
version = "0.1.0"
description = "Cost-based optimization of combined and sequential semantic operators using Jev"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "typesafe-sdk>=0.7.5",
    "huggingface-hub>=0.25.0",
    "python-dotenv>=1.0.0",
    "semantic-operators[typesafe]==0.11.0",
]

[project.scripts]
jev-smoke = "jev_milestone_1.smoke:main"
jev-prepare = "jev_milestone_1.prepare:main"
jev-evaluate = "jev_milestone_1.evaluate:main"
jev-experiment = "jev_milestone_2.cli:main"
jev-compare = "jev_milestone_2.runner:main"
jev-prepare-sembench = "jev_milestone_2.datasets:main"
jev-fetch-sembench = "jev_milestone_2.tools.fetch:main"
jev-make-annotation-sheets = "jev_milestone_2.tools.sheets:main"
jev-annotation-agreement = "jev_milestone_2.tools.agreement:main"
jev-build-task = "jev_milestone_2.tools.build_task:main"
jev-filter-profile = "jev_milestone_3.cli:profile_main"
jev-sample-analysis = "jev_milestone_3.cli:analysis_main"
jev-ordering-analysis = "jev_milestone_3.cli:ordering_main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_milestone_1", "src/jev_milestone_2", "src/jev_milestone_3"]
